<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser AI Test | proxyuser.dev</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #status {
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 6px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #output {
            margin-top: 25px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #0070f3;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Client-Side AI Test</h2>
    <p>This script downloads a tiny AI model into your browser cache and runs locally.</p>
    
    <div id="status">Loading AI engine... please wait.</div>
    
    <textarea id="prompt" disabled placeholder="Type a prompt here... (e.g., Write a haiku about coding)"></textarea>
    <button id="generate-btn" disabled>Generate Response</button>
    
    <h3>AI Output:</h3>
    <div id="output">The model output will appear here...</div>
</div>

<script type="module">
    // Import Transformers.js directly from a CDN web module
    import { pipeline } from 'https://jsdelivr.net';

    const statusDiv = document.getElementById('status');
    const promptInput = document.getElementById('prompt');
    const generateBtn = document.getElementById('generate-btn');
    const outputDiv = document.getElementById('output');

    let generator;

    async function initAI() {
        try {
            statusDiv.innerText = "Downloading model weights into your browser cache (approx. 150MB)...";
            
            // Initialize a text generation pipeline using a highly compressed model
            generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                device: 'webgpu', // Fallbacks to 'wasm' (CPU) if WebGPU isn't available
            });

            statusDiv.innerText = "🚀 AI Engine Loaded & Ready! (Compute is 100% local)";
            promptInput.disabled = false;
            generateBtn.disabled = false;
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Error loading WebGPU. Trying fallback execution...";
            try {
                // Fallback attempt with a slightly lighter pipeline constraint if WebGPU failed
                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct');
                statusDiv.innerText = "🚀 AI Engine Ready (Running on WASM/CPU fallback)";
                promptInput.disabled = false;
                generateBtn.disabled = false;
            } catch (fallbackError) {
                statusDiv.innerText = "Failed to initialize model. View console for details.";
            }
        }
    }

    async function generateText() {
        const text = promptInput.value.trim();
        if (!text) return;

        generateBtn.disabled = true;
        outputDiv.innerText = "Thinking...";

        try {
            const result = await generator(text, { 
                max_new_tokens: 100,
                temperature: 0.7 
            });
            
            outputDiv.innerText = result[0].generated_text;
        } catch (error) {
            outputDiv.innerText = "Generation failed: " + error.message;
        } finally {
            generateBtn.disabled = false;
        }
    }

    // Bind event listener to the button
    generateBtn.addEventListener('click', generateText);

    // Initialize the setup on page load
    initAI();
</script>

</body>
</html>
