<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser AI Test | proxyuser.dev</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #status {
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 6px;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #output {
            margin-top: 25px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #0070f3;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Client-Side AI Test</h2>
    <p>This script downloads a tiny AI model into your browser cache and runs locally.</p>
    
    <div id="status">Initializing execution engine...</div>
    
    <textarea id="prompt" disabled placeholder="Type a prompt here... (e.g., Write a haiku about coding)"></textarea>
    <button id="generate-btn" disabled>Generate Response</button>
    
    <h3>AI Output:</h3>
    <div id="output">The model output will appear here...</div>
</div>

<script type="module">
    // Import Transformers.js v3 from the official CDN web module
    import { env, pipeline } from 'https://jsdelivr.net';

    // Force the library to use standard WASM (CPU execution) for maximum mobile compatibility
    env.allowLocalModels = false;

    const statusDiv = document.getElementById('status');
    const promptInput = document.getElementById('prompt');
    const generateBtn = document.getElementById('generate-btn');
    const outputDiv = document.getElementById('output');

    let generator;

    async function initAI() {
        try {
            statusDiv.innerText = "Connecting to repository models...";

            // Initialize the pipeline strictly via CPU/WASM
            generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                device: 'wasm',
                progress_callback: (data) => {
                    if (data.status === 'progress') {
                        statusDiv.innerText = `Downloading weights: ${data.file}\nProgress: ${Math.round(data.progress)}%`;
                    } else if (data.status === 'ready') {
                        statusDiv.innerText = "Finalizing compilation layer...";
                    }
                }
            });

            statusDiv.innerText = "🚀 AI Engine Ready! (Compute is 100% local)";
            promptInput.disabled = false;
            generateBtn.disabled = false;
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Initialization failed: " + error.message;
        }
    }

    async function generateText() {
        const text = promptInput.value.trim();
        if (!text) return;

        generateBtn.disabled = true;
        outputDiv.innerText = "Thinking...";

        try {
            // Standard formatting prompt structure for instructions
            const formattedPrompt = `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            
            const result = await generator(formattedPrompt, { 
                max_new_tokens: 80,
                temperature: 0.6,
                return_full_text: false
            });
            
            outputDiv.innerText = result[0].generated_text;
        } catch (error) {
            outputDiv.innerText = "Generation failed: " + error.message;
        } finally {
            generateBtn.disabled = false;
        }
    }

    generateBtn.addEventListener('click', generateText);
    initAI();
</script>

</body>
</html>
